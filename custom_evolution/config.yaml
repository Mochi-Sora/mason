avg_evo:
  enabled: true
  max_tokens: 256
  temperature: 0.2
  timeout_ms: 45000  # fire-and-forget thread; clamped to >=15s in hook.py
nightly:
  hour: 2  # 02:00 local
  minute: 0
  lightweight_model: "local-1b"  # llama.cpp 1B
  heavyweight_model: "main"      # uses provider.main (opencode proxy)
  queue_max: 50
